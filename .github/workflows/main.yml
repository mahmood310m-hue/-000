name: Flutter Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Check secrets
      run: |
        if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
          echo "Error: Add SUPABASE_URL and SUPABASE_ANON_KEY in Settings > Secrets and variables > Actions"
          exit 1
        fi

    - name: Analyze
      run: flutter analyze --no-fatal-infos --no-fatal-warnings
      continue-on-error: true

    - name: Build release APK
      run: |
        flutter build apk --release \
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
          --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
          --dart-define=COUNTRY_CODE="${{ vars.COUNTRY_CODE || '964' }}" \
          --dart-define=AUTH_MODE="${{ vars.AUTH_MODE || 'phone' }}"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kauthar-school-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
